<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Koolest Fashion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="wrap page-header">
  <h1>Shop All</h1>
</div>

<div class="wrap section">
  <div class="shop-layout">
    <aside>
      <div class="filter-group">
        <h4>Search</h4>
        <input type="text" id="shopSearchInput" placeholder="Search products…" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:2px;" />
      </div>
      <div class="filter-group">
        <h4>Category</h4>
        <div id="catFilters"></div>
      </div>
    </aside>

    <div>
      <div class="shop-toolbar">
        <span id="resultCount" style="font-size:0.9rem; color:var(--text-dim)"></span>
        <select id="sortSelect">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      <div class="grid grid-4" id="shopGrid"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="products.js"></script>
<script src="store.js"></script>
<script src="chrome.js"></script>
<script>
  document.getElementById("catFilters").innerHTML = CATEGORIES.map(c => `
    <label class="filter-option">
      <input type="checkbox" class="cat-filter" value="${c.id}" />
      ${c.label}
    </label>`).join("");
</script>
<script src="js/shop.js"></script>
</body>
</html>
